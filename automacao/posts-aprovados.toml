rede = "x"
tipo = "fio"
data_sugerida = "2026-08-13"
aprovado = false
lembrete = "Depois de publicar, fixar o primeiro post no perfil (só dá para fazer na mão)."

  [[post.mensagem]]
  arte = "card-01-4mil.png"
  texto = '''
1/ O Corinthians tem 35 milhões de torcedores.
Sabe quantos decidem o futuro do clube? ~4 mil sócios.
A sede foi dada como garantia de dívida. E o torcedor? Assiste de fora.
Hoje nasce a resposta: A FIEL DECIDE. 🧵
'''

  [[post.mensagem]]
  texto = '''
2/ Em 1982, os jogadores tomaram as decisões do clube no voto, em plena ditadura, e chamaram de Democracia Corinthiana. "Ganhar ou perder, mas sempre com democracia" — a faixa é de 1983, no Morumbi, pro Brasil inteiro ver.
Democracia não é acessório do Corinthians. É o coração.
'''

  [[post.mensagem]]
  arte = "card-05-faixabarrada.png"
  texto = '''
2b/ E em 2026? A torcida levou faixa de protesto e a diretoria barrou na porta da Arena.
Anota: barraram a faixa. Não vão barrar a urna.
'''

  [[post.mensagem]]
  texto = '''
3/ O que é o A Fiel Decide:
✅ Qualquer corinthiano vota em consultas públicas
✅ As contas do clube traduzidas, com fonte
✅ 1 pessoa = 1 voto, sem peso por dinheiro
❌ Não pedimos Pix. Não tem vaquinha. Não tem dono.
'''

  [[post.mensagem]]
  texto = '''
4/ "Ah, mas vão roubar os votos."
Não dá: a urna é de vidro. Todo resultado sai com arquivo público que qualquer um reconta, e lacre criptográfico gratuito na blockchain do Bitcoin. Nem a gente consegue fraudar. Código 100% aberto.
'''

  [[post.mensagem]]
  texto = '''
5/ E o SAFiel? A gente completa, não compete.
O SAFiel traz o capital. A Fiel traz o mandato.
O que trava a reforma não é dinheiro, é política. Um mandato de milhões de corinthianos é a chave que destrava.
'''

  [[post.mensagem]]
  texto = '''
6/ Aqui não tem líder e não tem salvador. Quem entra vira co-dono da missão, com o mesmo peso de todos. Todo salvador vira cartola — esse ciclo a gente quebrou no desenho.
'''

  [[post.mensagem]]
  texto = '''
7/ Dezembro tem eleição no clube. A pergunta que todo candidato vai ouvir: você assina o compromisso com o voto do torcedor?
Quem assina, leva o mandato popular. Quem foge, fica marcado.
'''

  [[post.mensagem]]
  texto = '''
8/ Primeiro passo, de graça, 1 minuto:
✍️ Assina: https://afieldecide.github.io/site/assinar/
🗳️ Conhece: https://afieldecide.github.io/site/
📢 Dá RT e chama a quebrada.
O Corinthians é uma torcida que tem um time. Hora de voltar a mandar. 🖤🤍
#AFielDecide
'''


