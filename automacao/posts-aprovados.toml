# FILA DE POSTS APROVADOS — A Fiel Decide
#
# Este arquivo e a fonte da verdade do que pode ser publicado por API.
# O texto vem do `PLANO/11-fila-de-posts.md`; aqui ele vira dado que o
# script le. Mudou o plano? Traga a mudanca para ca a mao — o script nunca
# reescreve este arquivo.
#
# COMO APROVAR: troque `aprovado = false` por `aprovado = true`. Essa troca
# e o ato de aprovacao, e ela e sua. O script se recusa a publicar qualquer
# item com `aprovado = false`, e mesmo com `true` ele ainda pergunta antes
# de publicar.
#
# CAMPOS
#   id             identificador unico; e o que fica no registro de publicacao
#   rede           "instagram" ou "x"
#   tipo           "foto" (Instagram) ou "post"/"fio" (X)
#   data_sugerida  AAAA-MM-DD. So orienta; nao dispara nada sozinho
#   aprovado       trava principal
#   arte           nome do arquivo em ARTES/v2-papel-e-tinta/
#   texto          o texto exato que vai ao ar
#   condicao       quando existe, e uma regra do plano que voce confere na mao
#
# ATENCAO ao limite de caracteres do X: as pecas dos dias 2 a 14 foram
# escritas para o Instagram, que aceita legenda longa. No X elas estourariam
# o limite de uma conta comum. Elas estao aqui marcadas com
# `revisar_tamanho = true`; rode `py publicar.py --checar` para ver a contagem
# e decida entre encurtar ou publicar so no Instagram. O script nao encurta
# texto do movimento por conta propria.

[fila]
nome = "Onda 1"
observacao = "Só começa depois do PASSO 0 do PLANO/11 (bios, avatar e capa no ar)."


