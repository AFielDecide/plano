arte = "card-01-4mil.png"
texto = '''
~4 mil pessoas decidem o futuro de um clube de 35 milhões.

Esse é o tamanho do buraco democrático do Corinthians. Enquanto isso, a dívida bruta chegou a R$ 2,72 bilhões em 2025 e o Parque São Jorge foi dado como garantia num acordo com a União.

A crise não é só de dinheiro. É de poder.

Nasce o A Fiel Decide: consultas abertas onde cada corinthiano vale um voto, as contas do clube traduzidas com a fonte de cada número, e um abaixo-assinado pelo voto do sócio-torcedor já.

Não pedimos Pix. Não tem vaquinha, não tem loja, não tem caixa. Pedimos sua voz.

Assina no link da bio.

Fontes: Exame/Poder360 (dívida 2025), MeuTimão (sócios aptos, 2023), Corinthians/PGFN (acordo).

#AFielDecide #DemocraciaCorinthianaDigital #Corinthians #Fiel #Timão
'''

[[post]]
